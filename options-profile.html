<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>小T翻译 · 统一设置 · 个人信息</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <h1>统一设置</h1>
    <div class="sub">配置存本机，不上传。保存后立即对现有功能生效。</div>

    <!-- 子页面导航: 每个子页面独立成页, 当前页用 .active 标记 -->
    <nav class="tabs">
      <a class="tab" href="options.html">模型配置</a>
      <a class="tab active" href="options-profile.html">个人信息</a>
    </nav>

    <div class="page-head">
      <h2>个人信息</h2>
      <p>账户、套餐与用量的集中查看处；修改密码、退出登录等账户操作也在这里。</p>
    </div>

    <!-- 账户信息 -->
    <div class="card">
      <h2>账户信息 <span class="badge" id="accBadge">—</span></h2>
      <div class="desc">账户由邮箱标识，保存在 Supabase 云端；本页面不存储任何密码明文。</div>
      <div class="info-row"><label>邮箱</label><span id="accEmail">—</span></div>
      <div class="info-row"><label>用户 ID</label><span id="accUserId">—</span></div>
      <div class="info-row"><label>本次登录</label><span id="accLoginTime">—</span></div>
      <div class="actions">
        <button class="btn" id="accSignOut">退出登录</button>
        <span class="status" id="accStatus"></span>
      </div>
    </div>

    <!-- 套餐与用量 -->
    <div class="card">
      <h2>套餐与用量 <span class="badge" id="planBadge">—</span></h2>
      <div class="desc">套餐由服务端判定（客户端仅展示）；每日额度北京时间 0 点重置。</div>
      <div class="info-row"><label>当前套餐</label><span id="planName">—</span></div>
      <div class="info-row"><label>Pro 到期</label><span id="planExpires">—</span></div>
      <div class="info-row"><label>云端历史</label><span id="planCloudQuota">—</span></div>
      <div class="info-row"><label>官方引擎今日</label><span id="planProxyUsage">—</span></div>
      <div class="info-row"><label>AI 分析今日</label><span id="planAiUsage">—</span></div>
      <div class="actions">
        <button class="btn" id="planRefresh">刷新</button>
        <span class="status" id="planStatus"></span>
      </div>
    </div>

    <!-- 修改密码 -->
    <div class="card">
      <h2>修改密码</h2>
      <div class="desc">修改成功后当前登录不受影响，旧密码立即失效。</div>
      <div class="field"><label for="pwdNew">新密码</label><input type="password" id="pwdNew" autocomplete="new-password" spellcheck="false"></div>
      <div class="field"><label for="pwdNew2">确认新密码</label><input type="password" id="pwdNew2" autocomplete="new-password" spellcheck="false"></div>
      <div class="hint">至少 6 位；两次输入需一致。</div>
      <div class="actions">
        <button class="btn primary" id="pwdSave">修改密码</button>
        <span class="status" id="pwdStatus"></span>
      </div>
    </div>

    <div class="foot">账户数据保存在 Supabase 云端；套餐判定与配额以服务端为准。</div>
  </div>
  <script type="module" src="options-profile.js"></script>
</body>
</html>

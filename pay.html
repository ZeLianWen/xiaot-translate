<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>升级 Pro · 小T翻译</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f4f6f5; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2328;
    }
    .wrap { width: 420px; max-width: calc(100vw - 32px); background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #8c8c8c; margin-bottom: 18px; }
    .plans { display: flex; gap: 10px; margin-bottom: 16px; }
    .plan {
      flex: 1; border: 1px solid #e3e8e5; border-radius: 12px; padding: 12px; cursor: pointer; text-align: center;
      transition: border-color .15s, background .15s;
    }
    .plan:hover { border-color: #07c160; }
    .plan.active { border-color: #07c160; background: #f2fdf7; }
    .plan .name { font-size: 13px; color: #595959; }
    .plan .price { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .plan .price small { font-size: 12px; font-weight: 400; color: #8c8c8c; }
    .plan .tip { font-size: 11px; color: #07a050; margin-top: 2px; min-height: 14px; }
    .features { font-size: 12px; color: #595959; line-height: 1.9; margin: 0 0 16px; padding-left: 18px; }
    button.primary {
      width: 100%; padding: 11px 0; font-size: 14px; border: none; border-radius: 10px;
      background: #07c160; color: #fff; cursor: pointer;
    }
    button.primary:disabled { background: #b9e6cd; cursor: default; }
    .qrbox { display: none; margin-top: 16px; text-align: center; }
    .qrbox img { width: 200px; height: 200px; border: 1px solid #eee; border-radius: 8px; }
    .qrbox .tip { font-size: 12px; color: #8c8c8c; margin-top: 8px; line-height: 1.7; }
    .qrbox a { color: #07a050; }
    .status { margin-top: 12px; font-size: 12px; text-align: center; min-height: 16px; color: #8c8c8c; }
    .status.ok { color: #07a050; font-weight: 600; }
    .status.err { color: #d4380d; }
    .foot { margin-top: 16px; font-size: 11px; color: #a8a8a8; line-height: 1.8; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>升级 Pro</h1>
    <div class="sub" id="paySub">免配置直译 + 云端 AI 分析 + 官方语音合成；扫码支付后自动开通</div>

    <div class="plans">
      <div class="plan active" data-plan="pro_month">
        <div class="name">月卡</div>
        <div class="price">¥19.9<small>/月</small></div>
        <div class="tip"></div>
      </div>
      <div class="plan" data-plan="pro_year">
        <div class="name">年卡</div>
        <div class="price">¥199<small>/年</small></div>
        <div class="tip">≈¥16.6/月</div>
      </div>
    </div>

    <ul class="features">
      <li>官方翻译引擎 · 5 万字/日（≈50 页论文）</li>
      <li>云端 AI 分析 · 2 万字符/日</li>
      <li>官方语音合成 · 2000 字符/日</li>
      <li>云端历史同步 300 条 · 200MB</li>
    </ul>

    <button class="primary" id="payBtn">扫码支付</button>
    <div class="qrbox" id="qrBox">
      <img id="qrImg" alt="支付二维码">
      <div class="tip">用微信 / 支付宝扫码完成支付<br>支付成功后本页会自动刷新权益</div>
    </div>
    <div class="status" id="status"></div>

    <div class="foot">
      本机解析，云端仅在你使用 Pro 功能时按需发送文本，不用于训练。<br>
      7 天无理由退款 · 到期不自动续费
    </div>
  </div>
  <script type="module" src="pay.js"></script>
</body>
</html>
